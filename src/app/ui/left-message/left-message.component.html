<div class="avatar-holder">
    @if (frame().position === Position.Single || frame().position === Position.Bottom) {
        <img [src]="message().sender.avatar" alt="sender avatar">
    }
</div>

@if (message().messageType.toLowerCase() === 'icon') {
    <ng-container *ngTemplateOutlet="contentTemplate()"></ng-container>
} @else {
    <div class="message-bubble"
            [ngStyle]="{
                'border-top-left-radius': (frame().position === Position.Single || frame().position === Position.Top) ? '18px' : '4px',
                'border-top-right-radius': '18px',
                'border-bottom-right-radius': '18px',
                'border-bottom-left-radius': (frame().position === Position.Single || frame().position === Position.Bottom) ? '18px' : '4px'
            }">
        <ng-container *ngTemplateOutlet="contentTemplate()"></ng-container>
    </div>
}
