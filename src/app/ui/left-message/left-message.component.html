<div class="avatar-holder">
    @if (frame().position === Position.Single || frame().position === Position.Bottom) {
        <img [src]="message().sender.avatar" alt="sender avatar">
    }
</div>

@if (message().messageType.toLowerCase() === 'icon') {
    <ng-container *ngTemplateOutlet="contentTemplate()"></ng-container>
} @else {
        <div class="message-bubble"
                [class.no-padding]="message().messageType.toLowerCase() === 'image'"
                [ngStyle]="{
                    'border-top-left-radius': (frame().position === Position.Single || frame().position === Position.Top) ? 'var(--radius-xl)' : 'var(--radius-xs)',
                    'border-top-right-radius': 'var(--radius-xl)',
                    'border-bottom-right-radius': 'var(--radius-xl)',
                    'border-bottom-left-radius': (frame().position === Position.Single || frame().position === Position.Bottom) ? 'var(--radius-xl)' : 'var(--radius-xs)'
                }">
            <ng-container *ngTemplateOutlet="contentTemplate()"></ng-container>
        </div>
}
