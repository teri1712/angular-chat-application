<div class="input-bar-container">
    <div class="left-actions" [class.collapsed]="textContent()">
        <button class="action-btn" (click)="imageInput.click()" [disabled]="!chatId()" aria-label="Send image">
            <mat-icon>photo</mat-icon>
        </button>
        <input #imageInput type="file" hidden (change)="sendImage($event)">

        <button class="action-btn" (click)="fileInput.click()" [disabled]="!chatId()" aria-label="Attach file">
            <mat-icon>attach_file</mat-icon>
        </button>
        <input #fileInput type="file" hidden (change)="sendFile($event)">
    </div>

    <div class="input-wrapper">
        <input type="text" 
               placeholder="Type a message..." 
               [ngModel]="textContent()"
               (ngModelChange)="onChange($event)"
               [disabled]="!chatId()"
               (keydown.enter)="onSendClicked()"
               class="message-input">
    </div>

    <div class="right-actions">
        @if (textContent()) {
            <button class="send-btn" (click)="onSendClicked()" aria-label="Send message">
                <mat-icon svgIcon="send"></mat-icon>
            </button>
        } @else {
            <button class="icon-action-btn" (click)="onIconClicked()" aria-label="Send icon">
                <mat-icon [svgIcon]="getIcon(iconId())" color="primary"></mat-icon>
            </button>
        }
    </div>
</div>
