<h1 class="auth-title">set avatar</h1>

<div class="avatar-setup">
    <div class="avatar-preview-container">
        <div class="avatar-mask">
            <img [src]="preview()" alt="Avatar preview">
        </div>
        <button class="add-photo-btn" (click)="fileInput.click()" aria-label="Add photo">
            <span class="material-icons">add_a_photo</span>
        </button>
        <input #fileInput type="file" hidden (change)="onAvatarSelected($event)"/>
    </div>
</div>

<button class="btn-primary mt-lg" type="submit" (click)="onSubmit()">
    Finish Registration
</button>
