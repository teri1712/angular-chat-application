<div class="panel rounded py-5 px-5">
    <div class="auth-progress" [ngStyle]="{
        '--before-width': ((progress() - 1) / (totalSteps - 1) * 100) + '%'
    }">
        @for (step of steps(); track step) {
            <h2 [ngClass]="{
                'auth-p1': step == 1,
                'auth-p2': step == totalSteps,
                'auth-p-reached': progress() >= step
            }" [style.left]="(step - 1) * (100 / (totalSteps - 1)) + '%'">
                {{ step }}
            </h2>
        }
    </div>
    @if (error()) {
        <div class="error-banner" role="alert">
            <span class="material-icons">error_outline</span>
            {{ error() }}
        </div>
    }
    
    @switch (progress()) {
        @case (1) {
            <app-sign-up-info [initialData]="info" (next)="onCompleteInfo($event)"/>
        }
        @case (2) {
            <app-sign-up-avatar (back)="onBack()" (next)="onCompleteAvatar($event)"/>
        }
    }
</div>
