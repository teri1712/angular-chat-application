<div class="dialog-container">
    <div class="dialog-header">
        <h2 class="dialog-title">chat settings</h2>
    </div>

    <form [formGroup]="form" class="settings-form">
        <div class="field-group">
            <label class="field-label">Room Name</label>
            <input class="custom-input" formControlName="customName" placeholder="Enter room name">
            @if (form.get('customName')?.hasError('pattern')) {
                <div class="error-msg">Room name cannot be blank</div>
            }
        </div>

        <div class="field-group">
            <label class="field-label">Visuals</label>
            <button mat-button class="action-button" (click)="openIconSelectionDialog()">
                <mat-icon [svgIcon]="form.controls['icon'].value"></mat-icon>
                <span>Change Icon</span>
            </button>
            <button mat-button class="action-button" (click)="openThemeSelectionDialog()" style="margin-top: 8px;">
                <mat-icon>palette</mat-icon>
                <span>Change Theme</span>
            </button>
        </div>
    </form>

    <div class="dialog-actions">
        <button mat-button class="btn-cancel" (click)="onNoClick()">Cancel</button>
        <button mat-button class="btn-update" (click)="submit()" [disabled]="form.invalid">Update</button>
    </div>
</div>
