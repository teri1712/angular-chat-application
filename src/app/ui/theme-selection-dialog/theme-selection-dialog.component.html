<div class="dialog-container">
    <div class="dialog-header">
        <h2 class="dialog-title">select theme</h2>
    </div>

    @if (isLoading()) {
        <div class="loader-container">
            <mat-spinner diameter="48"></mat-spinner>
        </div>
    } @else {
        <div class="theme-grid">
            @for (theme of themes(); track theme.id) {
                <div class="theme-item" (click)="selectTheme(theme)">
                    <img class="theme-preview" [src]="theme.background" [alt]="theme.themeName">
                    <div class="theme-overlay">
                        <div class="theme-label">{{ theme.themeName | themeName }}</div>
                    </div>
                </div>
            }
        </div>
    }

    <div class="dialog-actions">
        <button mat-button class="btn-cancel" (click)="onNoClick()">Cancel</button>
    </div>
</div>
