<div class="nav-group">
    <button class="nav-btn" 
            [class.active]="currentRoute() === Routes.THREAD"
            (click)="navigateToThreads()"
            aria-label="Threads">
        <span class="material-icons">alternate_email</span>
        <span class="tooltip">Conversations</span>
    </button>
    <button class="nav-btn" 
            [class.active]="currentRoute() === Routes.SETTINGS"
            (click)="navigateToSettings()"
            aria-label="Settings">
        <span class="material-icons">settings</span>
        <span class="tooltip">Settings</span>
    </button>
    <button class="nav-btn" 
            (click)="openCreateGroupDialog()"
            aria-label="Create Group">
        <span class="material-icons">group_add</span>
        <span class="tooltip">Create Group</span>
    </button>
</div>

<div class="profile-section">
    <button class="profile-btn" (click)="toggleMenu($event)">
        <img [src]="profile().avatar" alt="avatar">
    </button>
    
    @if (menuOpen()) {
        <div class="profile-menu" (click)="$event.stopPropagation()">
            <div class="menu-item" (click)="logout()">
                <span class="material-icons">logout</span>
                Logout
            </div>
        </div>
    }
</div>
