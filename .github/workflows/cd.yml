name: Angular Chat Application CD

on:
  push:
    branches: [ master, develop ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        run: |
          docker build \
          -t teri1712/t1ichat-production:${{ github.sha }} \
          .

      - name: Push production image
        run: docker push teri1712/t1ichat-production:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config list project

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy t1ichat-frontend-${{ github.ref_name}} \
            --project side-projects-deployment \
            --image docker.io/teri1712/t1ichat-production:${{ github.sha }} \
            --region asia-southeast1 \
            --set-env-vars API_URL=${{ secrets.API_URL }},WEBSOCKET_HOST=${{ secrets.WEBSOCKET_HOST }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --allow-unauthenticated \
            --port 80
